worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
}

http {

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Compression (уменьшает трафик)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    upstream app_backend {
        # least_conn = направляем новые запросы на сервер с меньшим количеством соединений
        least_conn;

        # Явно указываем все 3 replica
        server app:3000 weight=1;
        server app:3000 weight=1;
        server app:3000 weight=1;

        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ============ SERVER BLOCK - главная конфигурация ============

    server {
        listen 80;
        server_name localhost;

        # ---- SECURITY HEADERS (защита) ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # ---- GZIP COMPRESSION ----
        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
        gzip_min_length 1000;

        # ---- NGINX STATUS - для мониторинга ----
        # Используется для проверки состояния nginx
        location /nginx_status {
            stub_status on;
            access_log off;
            # Разрешаем только локально
            allow 127.0.0.1;
            allow 172.0.0.0/8;  # Docker network
            deny all;
        }

        # ---- PROXY TO APP ----
        location / {
            # Rate limiting
            # burst=20 = позволяем всплеск до 20 запросов
            # nodelay = сразу отвечаем 429 если превышен лимит
            limit_req zone=api_limit burst=20 nodelay;

            # Прокси запросов на app_upstream
            proxy_pass http://app_backend;

            # Версия HTTP (keep-alive connections)
            proxy_http_version 1.1;

            # Headers для WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';

            # Стандартные headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Timeouts (в секундах)
            proxy_connect_timeout 60;
            proxy_send_timeout 60;
            proxy_read_timeout 60;

            # Перенаправления
            proxy_redirect off;
        }

        # ---- API ENDPOINTS с метриками ----
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Кешируем GET запросы на 60 секунд
            proxy_cache_methods GET HEAD;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Для POST/PUT/DELETE отключаем кеш
            if ($request_method ~* "^(POST|PUT|DELETE)$") {
                set $skip_cache 1;
            }
        }

        # ---- HEALTH CHECK (для load balancer) ----
        location /health {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Не логируем health checks
            access_log off;
        }

        # ---- СТАТИКА (если есть) ----
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            # Кешируем на 30 дней
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ---- 404 ----
        error_page 404 /404.html;
        location = /404.html {
            internal;
            default_type application/json;
            return 404 '{"error": "Not found"}';
        }
    }
}